[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ngsc-grpo"
version = "0.1.0"
description = "Source-calibrated GRPO feasibility experiments for NGSC"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<2",
  "Pillow>=9",
  "PyYAML>=6",
  "torch>=2.0,<2.9",
  "transformers>=4.42,<4.43",
  "tqdm>=4.63",
]

[project.scripts]
ngsc-grpo = "ngsc_grpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
