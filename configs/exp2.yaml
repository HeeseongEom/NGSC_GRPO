experiment:
  name: grpo_ngsc_exp2
  output_root: outputs
  exp1_name: grpo_ngsc_feasibility_v1
  split_seed: 2027

methods: [MaskCLIP, SCLIP, ClearCLIP, NACLIP]
sources: [BrainMRI, BUSI, KiTS, ColonDB]
targets: [Covid-QU-Ex, MedSeg, HAM10000, PH2]

actions:
  eta: [0.0, 3.0]
  tau: [0.0, 1.0]
  gamma: [0.0, 1.0]
  kappa_sp: [0.0, 4.0]
  q: [0.90, 0.999]
  sets:
    eta: [eta]
    eta_q: [eta, q]
    full4: [eta, tau, gamma, kappa_sp]
    full5q: [eta, tau, gamma, kappa_sp, q]

oracle:
  candidates: 2048
  candidate_chunk: 256
  pair_batch: 4
  seed: 2128

reward:
  rho: 8.0
  temperature_eta: 0.10
  temperature_tau: 0.08
  temperature_evidence: 0.10
  soft_iou_weight: 0.60
  soft_youden_weight: 0.40
  pixel_weight_with_presence: 0.75
  presence_weight: 0.25

policy:
  beta_floor: 0.5
  beta_max: 100.0
  reference_concentration: 20.0
  state_clip: [-5.0, 5.0]

trips_replication:
  updates: 200
  batch_states: 4
  group_size: 4
  ppo_epochs: 4
  lr: 1.0e-2
  kl_beta: 1.0e-3
  clip_epsilon: 0.2
  grad_clip: 1.0
  val_interval: 20

main_optimization:
  updates: 500
  batch_states: 16
  group_size: 8
  ppo_epochs: 4
  lr: 1.0e-3
  kl_beta: 1.0e-3
  clip_epsilon: 0.2
  grad_clip: 1.0
  val_interval: 25

seeds: [0, 1, 2]
runtime:
  device: cuda:0
  omp_threads: 1
  dataloader_workers: 0
